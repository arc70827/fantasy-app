name: Deploy Shiny app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::cpp11
            any::progress
          cache-version: 4

      - name: Build prepared Shiny cache
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          source("scripts/build_app_cache.R")

      - name: Validate prepared Shiny cache
        shell: Rscript {0}
        run: |
          cache_path <- file.path("data", "app_cache.rds")

          if (!file.exists(cache_path)) {
            stop("Cache was not created: ", cache_path, call. = FALSE)
          }

          cache <- readRDS(cache_path)

          required <- c(
            "matchups",
            "players",
            "team_names",
            "regular_season_matchups",
            "regular_season_players",
            "years",
            "managers",
            "all_teams",
            "all_positions",
            "all_slots",
            "latest_year",
            "latest_week",
            "pair_games",
            "manager_finishes",
            "playoff_years",
            "latest_playoff_year",
            "weekly_expected_wins",
            "weekly_lineup_analytics",
            "season_fantasy_analytics",
            "career_fantasy_analytics",
            "win_streaks"
          )

          missing <- setdiff(required, names(cache))

          if (length(missing) > 0) {
            stop(
              "Cache is missing required objects: ",
              paste(missing, collapse = ", "),
              call. = FALSE
            )
          }

          message(
            "Prepared cache validated successfully. Size: ",
            round(file.info(cache_path)$size / 1024^2, 2),
            " MB"
          )

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP_NAME: ${{ secrets.SHINYAPPS_APP_NAME }}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appDir = ".",
            appName = Sys.getenv("SHINYAPPS_APP_NAME"),
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            server = "shinyapps.io",
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
