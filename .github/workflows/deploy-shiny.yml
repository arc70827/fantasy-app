name: Deploy Shiny app

on:
  push:
    branches:
      main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::cpp11
            any::progress
          cache-version: 4

      - name: Verify deployment packages
        shell: Rscript {0}
        run: |
          required <- c(
            "rsconnect",
            "cpp11",
            "progress"
          )

          missing <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {
            install.packages(
              missing,
              repos = "https://cloud.r-project.org"
            )
          }

      - name: Build prepared Shiny cache
        shell: Rscript {0}
        run: |
          source("scripts/build_app_cache.R")

      - name: Validate prepared Shiny cache
        shell: Rscript {0}
        run: |
          cache_path <- "data/app_cache.rds"

          if (!file.exists(cache_path)) {
            stop("Prepared app cache was not created.")
          }

          cache <- readRDS(cache_path)

          required <- c(
            "cache_schema_version",
            "matchups",
            "players",
            "team_names",
            "weekly_expected_wins",
            "weekly_lineup_analytics",
            "season_fantasy_analytics",
            "career_fantasy_analytics"
          )

          missing <- setdiff(required, names(cache))

          if (length(missing) > 0) {
            stop(
              "Prepared app cache is missing: ",
              paste(missing, collapse = ", ")
            )
          }

          message(
            "Prepared app cache validated successfully."
          )

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP_NAME: ${{ secrets.SHINYAPPS_APP_NAME }}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appDir = ".",
            appName = Sys.getenv("SHINYAPPS_APP_NAME"),
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            server = "shinyapps.io",
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
