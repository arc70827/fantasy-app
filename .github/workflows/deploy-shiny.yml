name: Deploy Shiny app

on:
  push:
    branches:
      main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rsconnect
            any::cpp11
            any::progress
          cache-version: 3

      - name: Verify deployment packages
        shell: Rscript {0}
        run: |
          required <- c("rsconnect", "cpp11", "progress")
          missing <- required[
            !vapply(required, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            install.packages(
              missing,
              repos = "https://cloud.r-project.org"
            )
          }

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP_NAME: ${{ secrets.SHINYAPPS_APP_NAME }}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appDir = ".",
            appName = Sys.getenv("SHINYAPPS_APP_NAME"),
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            server = "shinyapps.io",
            forceUpdate = TRUE,
            launch.browser = FALSE
          )